<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ｍａｓｔｅｒ</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1e3c72);
      background-size: 400% 400%;
      animation: gradient 10s ease infinite;
    }

    h1 {
      font-family: monospace;
      font-size: 80px;
      color: #00ffff;
      text-shadow:
        0 0 5px #00ffff,
        0 0 10px #00ffff,
        0 0 20px #00ffff,
        0 0 40px #0ff,
        0 0 80px #0ff;
      animation: pulse 2s infinite;
    }

    @keyframes gradient {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    @keyframes pulse {
      0% {text-shadow: 0 0 10px #0ff;}
      50% {
        text-shadow:
          0 0 20px #0ff,
          0 0 40px #0ff,
          0 0 60px #0ff;
      }
      100% {text-shadow: 0 0 10px #0ff;}
    }
  </style>
</head>
<body>
  <h1>Ｍａｓｔｅｒ</h1>
</body>
</html>
